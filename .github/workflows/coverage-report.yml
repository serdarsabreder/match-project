name: coverage-report

on:
  push:
  pull_request:
  schedule:
    # Weekly: Monday 06:00 UTC (same cadence as todo-scan, independent run).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage:
    name: Backend and frontend coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest-cov

      - name: Backend coverage
        id: backend-cov
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest ../tests/backend \
            --cov=. \
            --cov-report=term \
            --cov-report=xml:../coverage-backend.xml
          # Extract summary percentage: "TOTAL   1234    100    92%"
          PERCENT=$(python - <<'PY'
          import re
          with open('../coverage-backend.xml') as fh:
              xml = fh.read()
          m = re.search(r'line-rate="([0-9.]+)"', xml)
          if not m:
              raise SystemExit(1)
          print(round(float(m.group(1)) * 100, 1))
          PY
          )
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          echo "Backend coverage: ${PERCENT}%"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend coverage
        id: frontend-cov
        working-directory: frontend
        run: |
          npm test -- --coverage
          PERCENT=$(node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
          let stTotal = 0, stHit = 0;
          for (const f of Object.values(report)) {
            for (const id of Object.keys(f.s)) { stTotal += 1; stHit += f.s[id] > 0 ? 1 : 0; }
          }
          console.log((stHit / stTotal * 100).toFixed(1));
          NODE
          )
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          echo "Frontend coverage: ${PERCENT}%"

      - name: Write summary to job summary
        shell: bash
        run: |
          {
            echo "## Coverage report"
            echo ""
            echo "| Project | Coverage |"
            echo "| --- | ---: |"
            echo "| Backend | ${{ steps.backend-cov.outputs.percent }}% |"
            echo "| Frontend | ${{ steps.frontend-cov.outputs.percent }}% |"
            echo ""
            echo "Generated by the coverage-report workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-backend.xml
            frontend/coverage/coverage-final.json
          if-no-files-found: warn
